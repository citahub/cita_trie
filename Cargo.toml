[package]
name = "cita_trie"
version = "6.0.1"
authors = ["yejiayu <yejiayu.fe@gmail.com>"]
description = "Modified Patricia Tree (aka Trie)."
license = "Apache-2.0"
edition = "2021"
readme = "README.md"
keywords = ["patricia", "mpt", "evm", "trie", "ethereum"]
repository = "https://github.com/cryptape/cita-trie"
homepage = "https://github.com/cryptape/cita-trie"
documentation = "https://docs.rs/cita_trie"

[dependencies]
parking_lot = "0.12"
rlp = { version = "0.6", features = ["derive"] }
hasher = { git = "https://github.com/citahub/hasher.git", branch = "master", features = [
    "hash-keccak",
] }

[dev-dependencies]
rand = "0.10"
hex = "0.4"
criterion = "0.8"
ethereum-types = "0.16"
uuid = { version = "1.22", features = ["serde", "v4"] }

[[bench]]
name = "trie"
harness = false
